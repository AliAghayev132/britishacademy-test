# ─────────────────────────────────────────────────────────────
#  British Academy — nginx reverse proxy
#
#  İki PM2 prosesi bir domendə birləşdirilir:
#     30001  Next.js  (sayt + admin panel)
#     30002  Express  (API + yüklənmiş fayllar + socket.io)
#
#  NİYƏ HƏR İKİSİ EYNİ DOMENDƏ (api.britishacademy.az deyil):
#  brauzer API-yə birbaşa müraciət edir. Ayrı subdomen olsaydı hər sorğuda
#  CORS preflight gedərdi və cookie-lər üçün əlavə konfiqurasiya lazım olardı.
#  Eyni origin bu problemlərin heç birini yaratmır.
#
#  ⚠️ BU FAYL YALNIZ SERTİFİKAT ALINANDAN SONRA QOYULUR.
#  Əvvəl `britishacademy.az.http.conf` işlədilir: nginx `ssl_certificate`
#  olmadan `listen 443 ssl` blokunu qəbul etmir və `nginx -t` səhv verir.
#
#  Fayl yeri:  /etc/nginx/sites-available/britishacademy.az
#  Aktivləşdirmə:
#     ln -sfn /etc/nginx/sites-available/britishacademy.az \
#             /etc/nginx/sites-enabled/britishacademy.az
#     nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────

# WebSocket üçün: Upgrade başlığı varsa "upgrade", yoxsa boş.
# Sabit `Connection: upgrade` yazsaq adi HTTP sorğuları da sınardı.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Yüklənmiş fayllar üçün keş zonası (şəkillər hər dəfə Express-dən keçməsin).
proxy_cache_path /var/cache/nginx/ba_uploads levels=1:2 keys_zone=ba_uploads:10m
                 max_size=1g inactive=7d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name britishacademy.az www.britishacademy.az;

    # certbot bu bloku HTTPS-ə yönləndirməyə çevirəcək.
    # Doğrulama faylları üçün yol açıq qalmalıdır.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://britishacademy.az$request_uri;
    }
}

# www → köksüz domen. Eyni məzmun iki ünvanda qalsa axtarış motorları
# onları ayrı sayt kimi görür və reytinq bölünür.
server {
    # HTTP/2 köhnə sintaksislə yazılır: `http2 on;` ayrıca direktiv kimi
    # yalnız nginx 1.25.1+-da mövcuddur, Ubuntu 24.04 isə nginx 1.24 gətirir
    # və "unknown directive http2" ilə çökür. Bu forma hər iki versiyada işləyir.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.britishacademy.az;

    # Sertifikat `certbot certonly` ilə alınır (bax deploy/README.md).
    # Yol sabitdir; yenilənmə zamanı fayllar yerində əvəz olunur.
    ssl_certificate     /etc/letsencrypt/live/britishacademy.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/britishacademy.az/privkey.pem;
    # TLS parametrləri BURADA yazılır, certbot-un options-ssl-nginx.conf
    # faylına `include` ilə istinad EDİLMİR: o fayl yalnız python3-certbot-nginx
    # plaqini ilə gəlir, biz isə `certonly` işlədirik. Fayl olmayanda nginx
    # ümumiyyətlə start olmur, yəni asılılıq həm lazımsız, həm risklidir.
    #
    # ssl_dhparam da yoxdur — o, yalnız köhnə DHE şifrələri üçün lazımdır,
    # aşağıdakı dəst isə tamamilə ECDHE-dir.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    return 301 https://britishacademy.az$request_uri;
}

server {
    # HTTP/2 köhnə sintaksislə yazılır: `http2 on;` ayrıca direktiv kimi
    # yalnız nginx 1.25.1+-da mövcuddur, Ubuntu 24.04 isə nginx 1.24 gətirir
    # və "unknown directive http2" ilə çökür. Bu forma hər iki versiyada işləyir.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name britishacademy.az;

    # Sertifikat `certbot certonly` ilə alınır (bax deploy/README.md).
    # Yol sabitdir; yenilənmə zamanı fayllar yerində əvəz olunur.
    ssl_certificate     /etc/letsencrypt/live/britishacademy.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/britishacademy.az/privkey.pem;
    # TLS parametrləri BURADA yazılır, certbot-un options-ssl-nginx.conf
    # faylına `include` ilə istinad EDİLMİR: o fayl yalnız python3-certbot-nginx
    # plaqini ilə gəlir, biz isə `certonly` işlədirik. Fayl olmayanda nginx
    # ümumiyyətlə start olmur, yəni asılılıq həm lazımsız, həm risklidir.
    #
    # ssl_dhparam da yoxdur — o, yalnız köhnə DHE şifrələri üçün lazımdır,
    # aşağıdakı dəst isə tamamilə ECDHE-dir.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Media yükləmə üçün. API-də limit 10 MB-dır (securityConfig.maxFileSize),
    # nginx ondan az olsa fayl serverə çatmadan kəsilər.
    client_max_body_size 12m;

    # Uzun sürən əməliyyatlar var: AI toplu tərcümə və WhatsApp toplu göndəriş
    # dəqiqələrlə çəkə bilər. Defolt 60 saniyə onları 504 ilə kəsərdi.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml image/svg+xml font/woff font/woff2;

    # Framework və server versiyasını gizlət.
    server_tokens off;

    # ── Bütün proxy blokları üçün ortaq başlıqlar ──
    # X-Forwarded-For OLMADAN Express bütün sorğuları nginx-in IP-si kimi
    # görər: sürət limiti bütün sayta bir nəfər kimi tətbiq olunar, kampaniya
    # linklərinin unikal ziyarətçi sayı isə həmişə 1 çıxar.
    # (app.js-də `app.set("trust proxy", 1)` təyin olunub — cütü budur.)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;

    # ── API ──
    # Sonda «/» YOXDUR: Express marşrutları /api altında quraşdırılıb,
    # «/» qoysaq nginx prefiksi kəsər və hər sorğu 404 verər.
    location /api/ {
        proxy_pass http://127.0.0.1:30002;
        proxy_set_header Connection "";
    }

    # ── Yüklənmiş fayllar ──
    # Şəkillər dəyişmir (fayl adında heş var), ona görə uzun keş.
    location /uploads/ {
        proxy_pass http://127.0.0.1:30002;
        proxy_set_header Connection "";

        proxy_cache ba_uploads;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── socket.io (real-time) ──
    location /socket.io/ {
        proxy_pass http://127.0.0.1:30002;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # WebSocket bağlantısı açıq qalır — timeout uzun olmalıdır.
        proxy_read_timeout 3600s;
    }

    # ── Next.js statik aktivləri ──
    # Fayl adlarında build heşi var, ona görə əbədi keşlənə bilər.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:30001;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Qalan hər şey: sayt, admin panel, /r/<kod>, sitemap, robots ──
    # 301 yönləndirmələr (köhnə saytın ünvanları) Next middleware-indədir,
    # ona görə nginx-də ayrıca qeyd YAZILMIR — hamısı buradan keçir.
    location / {
        proxy_pass http://127.0.0.1:30001;
        proxy_set_header Connection "";
    }
}
