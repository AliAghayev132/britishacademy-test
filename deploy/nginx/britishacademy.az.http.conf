# ─────────────────────────────────────────────────────────────
#  British Academy — BAŞLANĞIC konfiqi (yalnız HTTP, port 80)
#
#  NİYƏ AYRICA FAYL:
#  Yekun konfiqdə `listen 443 ssl` var, nginx isə `ssl_certificate` olmadan
#  belə bloku QƏBUL ETMİR — `nginx -t` səhv verir. Sertifikat isə hələ yoxdur,
#  çünki onu almaq üçün nginx-in işləməsi lazımdır. Klassik toyuq-yumurta.
#
#  Ona görə köçürmə iki mərhələdədir:
#    1) bu fayl → nginx işə düşür, sayt HTTP ilə açılır, ACME doğrulaması keçir
#    2) sertifikat alınır → britishacademy.az.conf ilə əvəz olunur
#
#  Bu mərhələdə sayt onsuz da tam işləkdir (HTTP üzərindən), yəni DNS
#  keçidindən sonra fasilə olmur.
# ─────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name britishacademy.az www.britishacademy.az;

    # Let's Encrypt doğrulama faylları. `certbot certonly --webroot` bura yazır.
    # Bu blok proxy-dən ƏVVƏL gəlməlidir, yoxsa sorğu Next.js-ə düşər və 404 olar.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 12m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    server_tokens off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://127.0.0.1:30002;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:30002;
        proxy_set_header Connection "";
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:30002;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:30001;
        proxy_set_header Connection "";
    }
}
