name: CI

# Kod keyfiyyəti yoxlaması. Deploy workflow-undan AYRIDIR — bu, sınıq kodun
# serverə çatmasının qarşısını alır; əvvəl heç bir baryer yox idi və hər push
# birbaşa istehsalata gedirdi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile: lockfile package.json ilə uyğun deyilsə burada
      # dayanır. Deploy-da işlədilən əmrin eynisidir, ona görə CI keçirsə
      # deploy-un asılılıq mərhələsi də keçəcək.
      - name: Asılılıqlar
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Testlər
        run: pnpm test
