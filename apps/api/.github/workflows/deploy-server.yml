name: Node.js Server CD

on:
  push:
    branches: [ main ]

jobs:
  deploy-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SECRET_KEY }}
          port: 22
          script: |
            #!/bin/bash
            set -euo pipefail

            # ========================================
            # 1. NVM mühitini yüklə
            # ========================================
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \
              . "$NVM_DIR/nvm.sh" || {
              echo "❌ nvm.sh tapılmadı: $NVM_DIR/nvm.sh"
              exit 1
            }

            # ========================================
            # 2. Node 20 versiyasını aktiv et
            # ========================================
            echo "🔄 Node 20 aktivləşdirilir..."
            nvm use 20 || {
              echo "⚠️ Node 20 tapılmadı, default Node istifadə olunur"
              nvm use default
            }

            # ========================================
            # 3. pnpm PATH-ını əlavə et
            # ========================================
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"

            # ========================================
            # 4. Versiyaları yoxla
            # ========================================
            echo "🔎 Quraşdırılmış versiyalar:"
            node -v || { echo "❌ node tapılmadı"; exit 1; }
            pnpm -v || { echo "❌ pnpm tapılmadı"; exit 1; }
            pm2 -v || { echo "❌ pm2 tapılmadı"; exit 1; }

            # ========================================
            # 5. Proyekt konfiqurasiyası
            # ========================================
            export NODE_ENV=production
            export PORT=30002
            APP_NAME="${PORT}:britishacademy-server"
            CWD="/var/www/britishacademy/server"

            echo "➡️ Proyekt qovluğuna keçilir: $CWD"
            cd "$CWD" || { echo "❌ Qovluq tapılmadı: $CWD"; exit 1; }

            # ========================================
            # 6. Git repository-ni yenilə
            # ========================================
            echo "📥 Repository yenilənir..."
            git fetch --all --prune

            if ! git merge --ff-only origin/main; then
              echo "⚠️ Fast-forward merge mümkün olmadı, hard reset edilir..."
              git reset --hard origin/main
            fi

            echo "✅ Repository yeniləndi: $(git rev-parse --short HEAD)"

            # ========================================
            # 7. Dependencies quraşdır
            # ========================================
            echo "📦 Dependencies quraşdırılır..."
            # pnpm 10 postinstall skriptlərini standart olaraq bloklayır və
            # ERR_PNPM_IGNORED_BUILDS ilə 1 qaytarır. `set -e` səbəbindən bu
            # bütün deploy-u dayandırır — PM2 restart işləmir, server köhnə
            # kodda qalır (endpointlər "not found" verir).
            # package.json-dakı pnpm.ignoredBuiltDependencies bunun qarşısını alır.
            pnpm install --no-frozen-lockfile --prod

            # ========================================
            # 8. PM2 ilə restart et
            # ========================================
            echo "🚀 PM2 ilə aplikasiya restart edilir..."

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              echo "🆕 Yeni aplikasiya başladılır..."
              PORT=$PORT pm2 start app.js --name "$APP_NAME" -i 1
            fi

            pm2 save --force

            # ========================================
            # 9. Sağlamlıq yoxlaması
            # ========================================
            # Restart "uğurlu" görünə bilər, amma proses açılışda çökərsə
            # (məsələn korlanmış modul) köhnə cavab verməyən vəziyyət qalır.
            # Deploy yalnız server həqiqətən cavab verəndə uğurlu sayılır.
            echo "🩺 Server yoxlanılır..."
            code=000
            healthy=0
            for i in $(seq 1 15); do
              code=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "http://127.0.0.1:$PORT/api/site" || echo 000)
              if [ "$code" = "200" ]; then healthy=1; break; fi
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "❌ Server 30 saniyə ərzində cavab vermədi (son HTTP kodu: $code)"
              pm2 logs "$APP_NAME" --lines 40 --nostream || true
              exit 1
            fi

            echo "✅ Node.js server deploy uğurla tamamlandı (port $PORT, HTTP $code)."
