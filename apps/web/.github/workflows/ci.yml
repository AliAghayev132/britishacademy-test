name: CI

# Kod keyfiyyəti yoxlaması. Deploy workflow-undan AYRIDIR — bu, sınıq kodun
# serverə çatmasının qarşısını alır; əvvəl heç bir baryer yox idi və hər push
# birbaşa istehsalata gedirdi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile: lockfile package.json ilə uyğun deyilsə burada
      # dayanır. Deploy-da işlədilən əmrin eynisidir.
      - name: Asılılıqlar
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Testlər
        run: pnpm test

      # Build ƏSAS yoxlamadır: bu gün asılılıq sürüşməsi (jsdom 30) build-i
      # sındırmışdı və bu, yalnız serverdə deploy zamanı üzə çıxmışdı.
      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
