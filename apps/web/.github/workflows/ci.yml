name: CI

# Kod keyfiyyəti yoxlaması. Deploy workflow-undan AYRIDIR — bu, sınıq kodun
# serverə çatmasının qarşısını alır; əvvəl heç bir baryer yox idi və hər push
# birbaşa istehsalata gedirdi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versiya DƏQİQ pinlənir: "11" ən son 11.x-i gətirir və o, xəbərsiz
      # dəyişə bilər. Lokalda lockfile-ı yaradan versiya ilə eyni olmalıdır.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          # pnpm 11.x Node >=22.13 tələb edir. Node 20 ilə setup-node-un
          # keş addımı (`pnpm store path`) ERR_UNKNOWN_BUILTIN_MODULE
          # (node:sqlite) ilə çökürdü.
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: lockfile package.json ilə uyğun deyilsə burada
      # dayanır. Deploy-da işlədilən əmrin eynisidir.
      - name: Asılılıqlar
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Testlər
        run: pnpm test

      # Build ƏSAS yoxlamadır: bu gün asılılıq sürüşməsi (jsdom 30) build-i
      # sındırmışdı və bu, yalnız serverdə deploy zamanı üzə çıxmışdı.
      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # Smoke testlər ayrıca job-dur: brauzer endirməsi ~1 dəqiqə əlavə edir,
  # ona görə lint/unit nəticəsini gözlətmirik — ikisi paralel gedir.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versiya DƏQİQ pinlənir: "11" ən son 11.x-i gətirir və o, xəbərsiz
      # dəyişə bilər. Lokalda lockfile-ı yaradan versiya ilə eyni olmalıdır.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          # pnpm 11.x Node >=22.13 tələb edir. Node 20 ilə setup-node-un
          # keş addımı (`pnpm store path`) ERR_UNKNOWN_BUILTIN_MODULE
          # (node:sqlite) ilə çökürdü.
          node-version: 22
          cache: pnpm

      - name: Asılılıqlar
        run: pnpm install --frozen-lockfile

      # Yalnız Chromium — smoke testlər üçün üç brauzer lazım deyil.
      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke testlər
        run: pnpm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3599

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
